name: Deploy Yass Noir

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy hosting
        run: firebase deploy --only hosting:yass-noir --project vibraaltoai-11f55 --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
